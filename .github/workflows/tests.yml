name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  polyglot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test Go engine
        working-directory: engines/go
        run: go test ./...
      - name: Compile C engine
        run: cc -std=c11 -O2 -Wall -Wextra -Werror engines/c/system_audit.c -o /tmp/noxtrace-c
      - name: Run Java Maven sample
        run: java engines/java/NoxtracePomAudit.java examples/pom-sample.xml


  rust-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust PCAP engine
        run: cargo test --manifest-path engines/rust/Cargo.toml
      - name: Inspect sample capture
        run: cargo run --quiet --manifest-path engines/rust/Cargo.toml -- pcap examples/empty.pcap
